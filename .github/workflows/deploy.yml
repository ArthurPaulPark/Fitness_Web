name: Build and deploy app to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GitHub code
      uses: actions/checkout@v4

    # 1. Java 환경 설정
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 2. 자바 소스 컴파일
    - name: Compile Java Source
      run: |
        javac WorkoutServer.java

    # 3. 자바 클래스 패키징 및 실행 환경 구축 (ZIP 아카이브 생성)
    - name: Package Application
      run: |
        echo "Main-Class: WorkoutServer" > manifest.txt
        jar cvfm app.jar manifest.txt *.class
        zip -r release.zip app.jar models/ static/ index.html coi-serviceworker.js pose_landmarker_full.task README.md

    # 4. release.zip 배포 및 startup command 설정
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'fitnessgrubyarthur'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: 'release.zip'
        startup-command: 'java -jar app.jar'

