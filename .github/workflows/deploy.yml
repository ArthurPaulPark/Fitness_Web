name: Build and deploy app to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GitHub code
      uses: actions/checkout@v4

    # 1. Java 환경 설정
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 2. 자바 소스 컴파일
    - name: Compile Java Source
      run: |
        javac WorkoutServer.java

    # 3. Azure Java 환경이 인식할 수 있는 표준 Executable JAR 구조로 패키징
    # (Main-Class 지정을 매니페스트 형식으로 완벽히 주입합니다)
    - name: Package Application into Executable JAR
      run: |
        echo "Main-Class: WorkoutServer" > manifest.txt
        jar cvfm app.jar manifest.txt *.class models/ static/ index.html coi-serviceworker.js pose_landmarker_full.task README.md

    # 4. 순수하게 app.jar 파일만 Azure로 전송 (잡다한 옵션 제거)
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'fitnessgrubyarthur'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: 'app.jar'
