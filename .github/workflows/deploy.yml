name: Build and deploy app to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GitHub code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Java Source
      run: javac *.java

    - name: Package Application into Executable JAR
      run: |
        echo "Main-Class: WorkoutServer" > manifest.txt
        jar cvfm app.jar manifest.txt *.class models/ static/ index.html coi-serviceworker.js pose_landmarker_full.task README.md

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'fitnessgrubyarthur'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: 'app.jar'
