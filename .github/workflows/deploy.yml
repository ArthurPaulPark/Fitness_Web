name: Build and deploy app to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GitHub code
      uses: actions/checkout@v4

    # 빌드 도구가 없으므로 프로젝트 폴더 전체를 그대로 압축하여 배포합니다.
    - name: Zip artifact for deployment
      run: zip -r release.zip ./*

# 4. 완성된 단일 실행형 app.jar 파일을 Azure에 배포하고 강제 실행
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'fitnessgrubyarthur'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: 'app.jar'
        startup-command: 'java -jar /home/site/wwwroot/app.jar' # 이 줄을 추가합니다!
